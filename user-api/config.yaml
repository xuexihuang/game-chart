config:
  Name: user.api
  Host: 0.0.0.0
  Port: 80
  Timeout: 60000

  Mode: dev
  Verbose: false
  Middlewares:
    Log: false
  ObjectName: test
  ServerOpenDate: "2023-06-13 00:00:00"
  Timezone: America/Sao_Paulo

  MaxBytes: 10485760

  DevServer:
    Port: 90
    MetricsPath: /metrics
    EnableMetrics: true

  Telemetry:
    Name: user-api
    Endpoint: http://jaeger-collector.kube-public.svc.cluster.local:14268/api/traces
    Sampler: 1.0
    Batcher: jaeger

  Mysql:
    DataSource: root:123456@tcp(basic-tidb.tidb-cluster.svc.cluster.local:4000)/new_game?charset=utf8mb4&parseTime=true

  Redis:
    Host: redis-master:6379
    Pass: game123456
    Type: node

  JwtAuth:
    AccessSecret: ae0536f9-6450-4606-8e13-5a19ed505da0
    AccessExpire: 2592000
    BufferTime: 7200
    MultiSite: false

  AdminRpc:
    Endpoints:
      - admin-rpc:80
    NonBlock: true
    Timeout: 999999999
    Middlewares:
      Duration: false
  PayRpc:
    Endpoints:
      - pay-rpc:80
    NonBlock: true
    Timeout: 999999999
    Middlewares:
      Duration: false
  UserRpc:
    Endpoints:
      - user-rpc:80
    NonBlock: true
    Timeout: 999999999
    Middlewares:
      Duration: false

  AggreApi:
    Addr: http://gameAggreApi:80

