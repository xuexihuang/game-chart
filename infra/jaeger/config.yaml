
provisionDataStore:
  cassandra: false
  elasticsearch: true
  kafka: false

storage:
  # allowed values (cassandra, elasticsearch, grpc-plugin, badger, memory)
  type: elasticsearch

collector:
  service:
    type: NodePort
    http:
      port: 14268
      nodePort: 30268

query:
  ingress:
    enabled: true
    # For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
    # See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
    ingressClassName: nginx
    hosts:
      - jaeger.game360.club

elasticsearch:
  global:
    storageClass: "nfs-client"
  master:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 300m
        memory: 1024Mi
    persistence:
      storageClass: "nfs-client"
  data:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 2Gi
      limits:
        cpu: 300m
        memory: 4Gi
    persistence:
      storageClass: "nfs-client"
  coordinating:
    ## @param coordinating.replicaCount Number of coordinating-only replicas to deploy
    ##
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 300m
        memory: 1024Mi
  ingest:
    ## @param ingest.enabled Enable ingest nodes
    ##
    enabled: true
    ## @param ingest.replicaCount Number of ingest-only replicas to deploy
    ##
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 300m
        memory: 1024Mi